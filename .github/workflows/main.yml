name: Monitor planu ZSTiB

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      send_test:
        description: "Wyślij testowe powiadomienie na Discord"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zstib-plan-monitor
  cancel-in-progress: false

jobs:
  check-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Sprawdź plan / wyślij test
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test || false }}
        run: python monitor.py

      - name: Zapisz nowy stan
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        run: |
          if git diff --quiet -- state.json && git diff --cached --quiet; then
            echo "Stan bez zmian."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "chore: update plan monitor state"
          git push
